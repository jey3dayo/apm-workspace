# ========================================
# Settings
# ========================================
[settings]
experimental = true

# ========================================
# Tools
# ========================================
[tools]
# Runtimes
node = "26"

# CLI tools
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:bats-core/bats-core" = "1.14.0"
fd = "10.5.0"
# Release assets are bare platform names, so `bin` gives the binary a stable name.
gh-actions-lock = { version = "0.4.0", bin = "gh-actions-lock" }
"github:jdx/jactionlint" = "2.1.0"
lefthook = "2.1.12"
"pipx:apm-cli" = "0.35.0"
"pipx:yamllint" = "1.38.0"
taplo = "0.10.0"

# npm packages
"npm:prettier" = "3.9.6"
"npm:tsx" = "4.23.13"

[tool_alias]
gh-actions-lock = "github:github/gh-actions-lock"

# ========================================
# Task Includes
# ========================================
[task_config]
includes = [
  "mise/validate.toml",
  "mise/lint.toml",
  "mise/test.toml",
  "mise/format.toml",
  "mise/native.toml",
]

# ========================================
# Workspace Commands
# ========================================
[tasks.bootstrap]
description = "Converge host-local configuration after mise bootstrap"
hide = true
depends = ["setup:mcp:host"]

[tasks."setup:mcp:host"]
description = "Configure host-local MCP servers for Codex and Claude"
hide = true
run = "bash ./scripts/apm-workspace.sh setup:mcp:host"

[tasks."agmsg:state:save"]
description = "Move the agmsg roster out of the deploy target before it is rewritten"
# Hidden on purpose: running save alone leaves the roster unlinked from the
# deploy target until a restore puts it back.
hide = true
run = "bash ./scripts/agmsg-state.sh save"

[tasks."agmsg:state:restore"]
description = "Recovery adapter: relink an agmsg roster unlinked by an install outside the migrate path"
run = "bash ./scripts/agmsg-state.sh restore"

[tasks.doctor]
description = "Inspect workspace state, deployed targets, and the learning-intake inbox"
run = [{ task = "doctor:workspace" }, { task = "doctor:intake" }]

[tasks."doctor:workspace"]
description = "Inspect the authoring checkout state and deployed targets"
run = "bash ./scripts/apm-workspace.sh doctor"

[tasks."doctor:intake"]
description = "Report the learning-intake inbox and warn when pending reports pile up"
run = "bash ./scripts/apm-workspace.sh doctor-intake"

[tasks."lock:diff"]
description = "Summarize apm.lock.yaml changes against a git ref (resolved commits, removed artifacts, target counts); read-only"
run = "bash ./scripts/lock-diff.sh"

[tasks."models:check"]
description = "Compare agmsg-delegation helper model allowlists with each provider's live model list (calls provider CLIs over the network); read-only"
run = "bash ./scripts/models-check.sh"

# ========================================
# Aggregation Tasks
# ========================================
[tasks.check]
description = "Run lightweight pre-deploy checks for the authoring checkout"
# lint:yaml sits here rather than under format:check: it is a linter, not a
# formatting check.
depends = [
  "format:check",
  "lint:yaml",
  "lint:actions",
  "actions-lock:verify",
  "lint:frontmatter",
  "lint:catalog-leaks",
  "validate",
]

[tasks.verify]
description = "Run deep verification for the authoring checkout"
run = [{ task = "check" }, { task = "test" }, { task = "smoke:catalog" }]

[tasks.test]
description = "Run the behavioral suite for the workspace scripts"
depends = ["test:sh"]
