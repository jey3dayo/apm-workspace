# ========================================
# Settings
# ========================================
[settings]
# Required by `depends_post` on [tasks.apply] (agmsg roster relink).
experimental = true

# ========================================
# Tools
# ========================================
[tools]
# Runtimes
node = "24"

# CLI tools
"aqua:BurntSushi/ripgrep" = "15.1.0"
"aqua:bats-core/bats-core" = "1.11.1"
fd = "10.4.2"
lefthook = "2.1.9"
"pipx:apm-cli" = "0.28.0"
"pipx:yamllint" = "1.38.0"
taplo = "0.10.0"

# npm packages
"npm:prettier" = "3.9.4"
"npm:tsx" = "4.22.5"

# ========================================
# Task Includes
# ========================================
[task_config]
includes = ["mise/catalog.toml", "mise/validate.toml", "mise/format.toml"]

# ========================================
# Workspace Commands
# ========================================
[tasks.bootstrap]
description = "Converge host-local configuration after mise bootstrap"
hide = true
depends = ["setup:mcp:host"]

[tasks."setup:mcp:host"]
description = "Configure host-local MCP servers for Codex and Claude"
hide = true
run = "bash ./scripts/apm-workspace.sh setup:mcp:host"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/apm-workspace.ps1 setup:mcp:host"

[tasks."agmsg:state:save"]
description = "Move the agmsg roster out of the deploy target before it is rewritten"
hide = true
run = "bash ./scripts/agmsg-state.sh save"

[tasks."agmsg:state:restore"]
description = "Relink the agmsg roster into the deployed skill directory"
# Hidden like its `save` counterpart, but kept directly runnable on purpose:
# `depends_post` does not fire when `apply` fails, which leaves the roster
# unlinked until someone runs this by hand.
hide = true
run = "bash ./scripts/agmsg-state.sh restore"

[tasks.apply]
description = "Deploy user-scope-compatible APM dependencies and compile Codex output"
depends = ["agmsg:state:save"]
depends_post = ["agmsg:state:restore"]
run = "bash ./scripts/apm-workspace.sh apply"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/apm-workspace.ps1 apply"

[tasks.refresh]
description = "Refresh the ~/.apm checkout and dependencies without deploying"
run = "bash ./scripts/apm-workspace.sh refresh"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/apm-workspace.ps1 refresh"

[tasks.doctor]
description = "Inspect ~/.apm workspace state and deployed targets"
run = "bash ./scripts/apm-workspace.sh doctor"
run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/apm-workspace.ps1 doctor"

# ========================================
# Aggregation Tasks
# ========================================
[tasks.check]
description = "Run lightweight pre-deploy checks for the ~/.apm workspace"
# lint:yaml sits here rather than under format:check: it is a linter, not a
# formatting check.
depends = ["format:check", "lint:yaml", "validate"]

[tasks.verify]
description = "Run deep verification for the ~/.apm workspace"
run = [{ task = "check" }, { task = "test" }, { task = "smoke:catalog" }]

[tasks.test]
description = "Run both behavioral suites for the workspace scripts"
# Serial on purpose: both suites drive temp installs and sync the same deployed
# targets, so running them in parallel races on shared workspace state.
run = [{ task = "test:ps" }, { task = "test:sh" }]

[tasks.deploy]
description = "Run checks, deploy the current workspace state, and inspect targets"
run = [{ task = "check" }, { task = "apply" }, { task = "doctor" }]

# ========================================
# Meta Tasks
# ========================================
[tasks.upgrade]
description = "Refresh upstream APM dependencies, verify, and inspect the ~/.apm workspace"
run = ["apm update -g", { task = "deploy" }]

[tasks."refresh:deploy"]
description = "Update, verify, and deploy the ~/.apm workspace locally from the current manifest and lock"
# Broader than the day-to-day rollout path; `deploy` is the normal entry point.
hide = true
run = [{ task = "refresh" }, { task = "deploy" }]
