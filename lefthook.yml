# lefthook が見つからないとき、生成される hook は既定では警告を出して exit 0 する
# ——つまり gate 無しで commit / push が通る。この workspace では gate の不在を
# 成功と区別できないほうが危険なので、hard fail させる。
assert_lefthook_installed: true

# meta（冒頭のバナー枠）だけを外す。残りは lefthook の既定と同じ。
output:
  - summary
  - success
  - failure
  - execution
  - execution_out
  - execution_info
  - skips

pre-commit:
  parallel: true
  jobs:
    - name: prettier-markdown
      glob: "*.md"
      run: mise exec -- prettier --write --log-level error {staged_files}
      stage_fixed: true

    - name: prettier-yaml
      glob: "*.{yml,yaml}"
      exclude:
        - "apm.lock.yaml"
      run: mise exec -- prettier --write --log-level error {staged_files}
      stage_fixed: true

    - name: taplo-toml
      glob: "*.toml"
      run: mise exec -- taplo format {staged_files}
      env:
        RUST_LOG: taplo=warn
      stage_fixed: true

    - name: bold-headings
      glob: "{catalog/*.md,catalog/**/*.md}"
      run: mise run format:markdown:bold-headings
      stage_fixed: true

    - name: workspace-scripts
      glob: "scripts/apm-workspace.sh"
      run: bash -n scripts/apm-workspace.sh

    - name: jactionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- jactionlint {staged_files}

    # Offline: every uses: has an actions.lock entry. It reads the working tree,
    # so CI stays the authoritative check.
    - name: actions-lock
      glob: ".github/**"
      run: mise run actions-lock:verify

    - name: shell-syntax
      glob: "scripts/*.sh"
      run: bash -n {staged_files}

pre-push:
  # doctor is deliberately not a push gate: it inspects this machine's deployed
  # output, so it fails on any clone that has not run a rollout yet.
  jobs:
    - name: workspace-scripts
      glob: "scripts/apm-workspace.sh"
      run: bash -n scripts/apm-workspace.sh

    - name: test:sh
      glob: "{scripts/*.sh,scripts/lib/*.awk,scripts/lib/*.sh,catalog/.apm/skills/**/scripts/*.sh,catalog/.apm/skills/**/scripts/*.py,manual-skills/.apm/skills/**/scripts/*.py,tests/*.bats,mise.toml,mise/test.toml}"
      # Hooks export GIT_DIR for the repo being pushed; suites must not inherit it.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE mise run test:sh

    # Offline: every uses: has an actions.lock entry. Like the pre-commit job it
    # reads the working tree, not the pushed ref, so CI stays the authoritative check.
    - name: actions-lock
      glob: "{.github/**,mise.toml,mise/lint.toml}"
      run: mise run actions-lock:verify

    - name: format:markdown:bold-headings:check
      glob: "{catalog/*.md,catalog/**/*.md,scripts/format-bold-headings.*,scripts/replace-bold-headings.ts,mise.toml,mise/format.toml}"
      run: mise run format:markdown:bold-headings:check

    - name: format:markdown:check
      glob: "{*.md,**/*.md,.prettierrc.json,.prettierignore,mise.toml,mise/format.toml}"
      run: mise run format:markdown:check

    - name: format:toml:check
      glob: "{*.toml,**/*.toml,mise.toml,mise/format.toml}"
      run: mise run format:toml:check

    - name: format:yaml:check
      glob: "{*.yml,*.yaml,**/*.yml,**/*.yaml,.prettierrc.json,.prettierignore,mise.toml,mise/format.toml}"
      run: mise run format:yaml:check

    - name: lint:yaml
      glob: "{*.yml,*.yaml,**/*.yml,**/*.yaml,.yamllint.yml,mise.toml,mise/lint.toml}"
      run: mise run lint:yaml

    - name: lint:frontmatter
      glob: "{catalog/**/*.md,scripts/lint-frontmatter.*,mise.toml,mise/lint.toml}"
      run: mise run lint:frontmatter

    # no glob: the optional denylist covers every tracked file, so any change
    # can introduce a hit.
    - name: lint:catalog-leaks
      run: mise run lint:catalog-leaks

    # no glob: validates apm.yml/apm.lock.yaml wiring against the whole tracked
    # workspace — inputs cannot be safely enumerated. Deployed-target inspection
    # is doctor's, not this task's.
    - name: validate:workspace
      run: mise run validate:workspace

    # no glob: normalizes/validates the entire managed catalog package tree.
    - name: validate:catalog
      run: mise run validate:catalog
