# yamllint has no ignore file here, so lint:yaml excludes apm.lock.yaml at the fd level.
["lint:yaml"]
description = "Lint YAML files in the authoring checkout"
hide = true
run = "fd -e yml -e yaml --exclude apm.lock.yaml -X yamllint"

["lint:actions"]
description = "Lint GitHub Actions workflows with jactionlint"
hide = true
run = "jactionlint"

["actions-lock:verify"]
description = "Offline check: every uses: has an actions.lock entry and the lockfile parses"
hide = true
run = "gh-actions-lock --verify-local"

# CI only: coverage is checked offline above, provenance (locked commit still reachable
# from its ref) needs network and a token that can read every locked action repository.
["actions-lock:upstream"]
description = "CI check: actions.lock covers every uses: and each locked commit still verifies upstream (needs network and GH_TOKEN)"
hide = true
run = "gh-actions-lock --verify"

["lint:frontmatter"]
description = "Validate YAML frontmatter in the managed catalog (agents/skills/commands/rules)"
hide = true
run = "bash ./scripts/lint-frontmatter.sh"

["lint:catalog-leaks"]
description = "Detect repository-specific values and unresolved agent references in the managed catalog"
hide = true
run = "bash ./scripts/lint-catalog-leaks.sh"
