# Native APM distribution (docs/native-distribution.md): the sole operator entrypoint since the legacy `deploy` was
# removed on 2026-11-10. Its internal stages share persistent operation-lock metadata in
# ~/.cache/apm-native-operation.lock.

["native:sync"]
description = "Back up, rehearse, migrate and verify pushed main in one command; exact removal/override approvals: -- --help"
run = "bash ./scripts/native.sh sync"
