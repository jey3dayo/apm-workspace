# Native APM distribution (docs/native-distribution.md). Coexists with `deploy` until it replaces it; it is not a third
# permanent distribution path. apply targets a disposable HOME only; the real HOME is blocked, backup and rehearse can read it.

["native:plan"]
description = "Print the SHA-pinned consumer manifest and the native install/compile steps; writes nothing"
run = "bash ./scripts/native.sh plan"

["native:render"]
description = "Print the consumer manifest for -- --source-ref <SHA>"
run = "bash ./scripts/native.sh render"

["native:apply"]
description = "apm install -g --only apm + compile -g into a disposable HOME: -- --home <dir> --source-ref <SHA> (the real HOME is blocked)"
run = "bash ./scripts/native.sh apply"

["native:backup"]
description = "Copy the non-secret paths native:apply can change: -- --real-home --backup-dir <new dir>"
run = "bash ./scripts/native.sh backup"

["native:rehearse"]
description = "Clone a native:backup into a scratch HOME, run the same install + compile there and count lost files: -- --real-home --backup-dir <backup> --source-ref <SHA>"
run = "bash ./scripts/native.sh rehearse"
