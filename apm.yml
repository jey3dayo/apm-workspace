    - git: ibelick/ui-skills
      ref: f511eae41c996e3953fbeabf95d38e4077d40711
      skills:
        - fixing-accessibility
    - Jakubantalik/transitions-dev/skills/transitions-dev#038b0bdc75375c2beed51d1e824c98cdc7b86f8c
    - git: nextlevelbuilder/ui-ux-pro-max-skill
      ref: 6ae86f61f520d6ca229d2f40e070410638c908c5
      skills:
        - ui-ux-pro-max

    # --- browser / analysis ---
    - browser-use/browser-harness/skills/browser-harness#c7bb3da435477494450aeb4b19a501fd04bb897d
    - jackwener/opencli/skills/opencli-usage#9bc5f5ca132ec4d4e48d7ee517d4303bf159e8e8 # v2.0.3
    - jackwener/opencli/skills/opencli-browser#9bc5f5ca132ec4d4e48d7ee517d4303bf159e8e8 # v2.0.3
    - openai/skills/skills/.curated/screenshot#49f948faa9258a0c61caceaf225e179651397431
    - tt-a1i/archify/archify#7e45f36c66de1254d5ad6ba1d878f6499ea269fd # v3.2.0

    # --- agent tools ---
    - vercel-labs/agent-desktop/skills/agent-desktop#54855b6225aec00da4ac65e2d0362fd41cd9fcb3 # v1.2.0
    - agavra/tuicr/skills/tuicr#f098fb8f0911f6b9b14c80e23f79ab084cf5ef91 # v0.28.0
    - fujibee/agmsg#4a712f2aeba8f0b2070f7533b827c7cac78c9fdf # v1.5.1
    - humanlayer/skills/plugins/show-me/skills/show-me#4d69d20f6e9b57b4fcf0d501ccfb1be961f0f329
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp@latest"
    # Web search, fetch, and research for general verification and up-to-date information (Context7 covers library docs)
    - name: parallel
      registry: false
      transport: http
      url: https://mcp.parallel.ai/mcp
    # App-side connectors don't reach the CLI agents; ops rules and GraphQL fallback live in catalog/.apm/skills/linear-task-ops.
    - name: linear
      registry: false
      transport: http
      url: https://mcp.linear.app/mcp
scripts: {}
executables:
  allow:
    github.com/fujibee/agmsg:
      bin: true
    github.com/ibelick/ui-skills:
      bin: true
    github.com/tt-a1i/archify/archify:
      bin: true
