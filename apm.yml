  - codex
  - cursor
  - agent-skills
dependencies:
  apm:
    # --- workspace ---
    - jey3dayo/apm-workspace/catalog#main
    - jey3dayo/apm-workspace/manual-skills#main

    # --- review ---
    - cursor/plugins/cursor-team-kit/skills/thermo-nuclear-code-quality-review#d0ef80d86795816da932a153458c5dbe192d294e
    - shadcn/improve#cac56e1ebd3c279aa9153616cfeac7b174ab90f9

    # --- engineering / writing ---
    - coji/natural-japanese/skills/natural-japanese#840bd400cbcb64c8b64d492a144da54fc05776c5 # v2.0.0
    - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git
      ref: 8f2d57610a73efc97d743c9b0b0ecb1002e09fa4
      alias: japanese-tech-writing
    - git: mattpocock/skills
      ref: 4ae2317ddb22b046e26455e4f9c9b3aaaf62212d # v1.3.2
      skills:
        - codebase-design
        - domain-modeling
        - grilling
        - improve-codebase-architecture
        - prototype
        - research
        - retro
        - setup-matt-pocock-skills
        - wait-what
        - wayfinder
        - writing-for-agents
    - nanaism/yomiyasu/skills/yomiyasu#2318a6d0820a58d3f8cfadc75af86978bb739185 # v3.0.1

    # --- react ---
    - millionco/react-doctor/skills/react-doctor#94a349b8a38c4e80f7600a74766b00ef3a76fa39 # v2.4.0
    - vercel-labs/agent-skills/skills/react-best-practices#1a2c79d4e6c4a2283dc2c614b6538cbe1ed5ca62

    # --- design ---
    - git: emilkowalski/skills
      ref: 715c1807e08c497cfd1dc4feb450a2a3300ef2a9
      skills:
        - animation-performance
        - apple-design
        - break-ui
        - emil-design-eng
        - find-animation-opportunities
        - improve-animations
        - review-animations
    - git: heydamir/unslop
