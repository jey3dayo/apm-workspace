name: apm-workspace
version: 1.0.0
description: APM project for apm-workspace
author: jey3dayo
targets:
  - claude
  - codex
  - cursor
  - agent-skills
  - antigravity
dependencies:
  apm:
    # --- workspace ---
    - jey3dayo/apm-workspace/catalog#main
    - jey3dayo/apm-workspace/manual-skills#main

    # --- review ---
    - cursor/plugins/cursor-team-kit/skills/thermo-nuclear-code-quality-review#7a583913eb1b8d1a0ee76753d1a2cf072e7b54f9
    # Plugin-form package: APM 0.37+ would register it as a Claude native plugin and
    # rewrite ~/.claude/settings.json, so Claude is excluded (see docs/package-decisions.md).
    - git: shadcn/improve
      ref: cac56e1ebd3c279aa9153616cfeac7b174ab90f9
      targets:
        - codex
        - cursor
        - agent-skills
    # pstack (v0.15.48): no-comments and the skills it directly references.
    # poteto-mode and arena are intentionally not pinned; see docs/package-decisions.md.
    - cursor/plugins/pstack/skills/no-comments#ca782ed8b3c2c521cead8e1720d55c3a5dbf2347
    - cursor/plugins/pstack/skills/why#ca782ed8b3c2c521cead8e1720d55c3a5dbf2347
    - cursor/plugins/pstack/skills/architect#ca782ed8b3c2c521cead8e1720d55c3a5dbf2347
    - cursor/plugins/pstack/skills/principle-fix-root-causes#ca782ed8b3c2c521cead8e1720d55c3a5dbf2347
    - cursor/plugins/pstack/skills/principle-redesign-from-first-principles#ca782ed8b3c2c521cead8e1720d55c3a5dbf2347

    # --- engineering / writing ---
    - coji/natural-japanese/skills/natural-japanese#840bd400cbcb64c8b64d492a144da54fc05776c5 # v2.0.0
    - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git
      ref: 8f2d57610a73efc97d743c9b0b0ecb1002e09fa4
      alias: japanese-tech-writing
    - git: mattpocock/skills
      ref: abeeaf95660ba9e8b7c753eb38f441ca707a8823 # after v1.3.2
      skills:
        - codebase-design
        - domain-modeling
        - grilling
        - improve-codebase-architecture
        - prototype
        - research
        - retro
        - setup-matt-pocock-skills
        - wayfinder
        - writing-for-agents
      # Plugin-form package with a skills: selection: APM 0.37+ parks it for Claude
      # at user scope, so Claude is excluded (see docs/package-decisions.md).
      targets:
        - codex
        - cursor
        - agent-skills
    - nanaism/yomiyasu/skills/yomiyasu#8831b14a5c2c12d41096495f0b8fe52d46d390c6 # v3.3.0
    - git: t3dotgg/tstack
      ref: 11e37a74d0a6868c121cd0910ab2b3bd9873b92a
      skills:
        - babysit-pr
        - council
        - file-pr
        - full-send
        - full-stop
        - modernize
        - sol-loop
        - takeover

    # --- react ---
    - millionco/react-doctor/skills/react-doctor#b6ba66ef427bf81995555e380eeba679f8b5d305 # v2.4.0
    - vercel-labs/agent-skills/skills/react-best-practices#5a37a6329fbad3666c3207392a6a7c0110e92efb

    # --- design ---
    - git: emilkowalski/skills
      ref: 64eb3deb9a5fbfa041faf783e0bc3fd635872e9c
      skills:
        - animation-performance
        - apple-design
        - break-ui
        - emil-design-eng
        - find-animation-opportunities
        - improve-animations
        - review-animations
    - git: heydamir/unslop
      path: skills/unslop
      ref: 620163eedb3529d9cd23a3994ed8d287d06f760d
      alias: unslop-ui
    - git: ibelick/ui-skills
      ref: 7ef0076fce1dfa39dd2bc43b7dc13add6eda8a41
      skills:
        - fixing-accessibility
    - Jakubantalik/transitions-dev/skills/transitions-dev#038b0bdc75375c2beed51d1e824c98cdc7b86f8c
    - git: nextlevelbuilder/ui-ux-pro-max-skill
      ref: 6ec2bb58334ca3014573c4cbd4834ee3a40afd9d
      skills:
        - ui-ux-pro-max
      # Plugin-form package with a skills: selection: APM 0.37+ parks it for Claude
      # at user scope, so Claude is excluded (see docs/package-decisions.md).
      targets:
        - codex
        - cursor
        - agent-skills

    # --- browser / analysis ---
    - browser-use/browser-harness/skills/browser-harness#797f2d05e30e58b217ff621a99d302d712dc38da
    - jackwener/opencli/skills/opencli-usage#9bc5f5ca132ec4d4e48d7ee517d4303bf159e8e8 # v2.0.3
    - jackwener/opencli/skills/opencli-browser#9bc5f5ca132ec4d4e48d7ee517d4303bf159e8e8 # v2.0.3
    - openai/skills/skills/.curated/screenshot#49f948faa9258a0c61caceaf225e179651397431
    - tt-a1i/archify/archify#44781293f38728baf04dbad33ce1a0cef8c39cca # after v3.2.0

    # --- agent tools ---
    - vercel-labs/agent-desktop/skills/agent-desktop#b0b7277bea09b770ef9d1fb45aad667bc432cd57 # v1.3.1
    - agavra/tuicr/skills/tuicr#a8185f2c701ed213c8407b8bda79dd6487d302ec # v0.29.0
    - humanlayer/skills/plugins/show-me/skills/show-me#4d69d20f6e9b57b4fcf0d501ccfb1be961f0f329
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp@latest"
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "chrome-devtools-mcp@latest"
        - "--ignoreDefaultChromeArg=--disable-extensions"
    # Web search, fetch, and research for general verification and up-to-date information (Context7 covers library docs)
    - name: parallel
      registry: false
      transport: http
      url: https://mcp.parallel.ai/mcp
    # App-side connectors don't reach the CLI agents; ops rules and GraphQL fallback live in catalog/.apm/skills/linear-task-ops.
    - name: linear
      registry: false
      transport: http
      url: https://mcp.linear.app/mcp
    # Voice input dictionary and customization settings (HTTP transport, OAuth via client)
    - name: aqua-voice
      registry: false
      transport: http
      url: https://api.aquavoice.com/mcp
    # App-side connectors don't reach the CLI agents; CLI agents need this to check error issues during development and releases (OAuth via client, unscoped so the project is chosen per conversation)
    - name: sentry
      registry: false
      transport: http
      url: https://mcp.sentry.dev/mcp
scripts: {}
executables:
  allow:
    ibelick/ui-skills:
      bin: true
    mattpocock/skills:
      bin: true
    nanaism/yomiyasu/skills/yomiyasu:
      bin: true
    nextlevelbuilder/ui-ux-pro-max-skill:
      bin: true
    tt-a1i/archify/archify:
      bin: true
    aqua-voice:
      mcp: true
    chrome-devtools:
      mcp: true
    context7:
      mcp: true
    linear:
      mcp: true
    parallel:
      mcp: true
    sentry:
      mcp: true
