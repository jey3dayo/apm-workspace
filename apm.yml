  - codex
  - cursor
  - agent-skills
dependencies:
  apm:
    # --- workspace ---
    - jey3dayo/apm-workspace/catalog#main
    - jey3dayo/apm-workspace/manual-skills#main

    # --- review ---
    - cursor/plugins/cursor-team-kit/skills/thermo-nuclear-code-quality-review#3dbd22ff12742fb28c9700b9760baa29ed41dc13
    - shadcn/improve#cac56e1ebd3c279aa9153616cfeac7b174ab90f9

    # --- engineering / writing ---
    - coji/natural-japanese/skills/natural-japanese#840bd400cbcb64c8b64d492a144da54fc05776c5 # v2.0.0
    - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git
      ref: 8f2d57610a73efc97d743c9b0b0ecb1002e09fa4
      alias: japanese-tech-writing
    - git: mattpocock/skills
      ref: 5863806dd4e15c63174bee4e7515a4256792ecfa # v1.3.2
      skills:
        - codebase-design
        - domain-modeling
        - grilling
        - improve-codebase-architecture
        - prototype
        - research
        - retro
        - setup-matt-pocock-skills
        - wait-what
        - wayfinder
        - writing-for-agents
    - nanaism/yomiyasu/skills/yomiyasu#db78b9bc5e868549b517a037df7a4d1c93edac23 # v3.0.1

    # --- react ---
    - millionco/react-doctor/skills/react-doctor#661cb187fbfe4e992acc89f76933e4f51244639f # v2.4.0
    - vercel-labs/agent-skills/skills/react-best-practices#1a2c79d4e6c4a2283dc2c614b6538cbe1ed5ca62

    # --- design ---
    - git: emilkowalski/skills
      ref: 0f2e23b32bb1265e84cff8d3e75785fec953fb1b
      skills:
        - animation-performance
        - apple-design
        - break-ui
        - emil-design-eng
        - find-animation-opportunities
