        - "@t09tanaka/mcp-simple-voicevox"
    # Cross-repository public research foundation managed by this APM workspace.
    # This manifest entry is the source of truth; runtime MCP blocks are deployed outputs.
    - name: jina-reader
      registry: false
      transport: streamable-http
      url: https://mcp.jina.ai/v1?include_tags=search,read
      headers:
        Authorization: Bearer ${JINA_API_KEY}
    # Linear needs the same tool set on the CLI (Claude Code / Codex); app-side
    # connectors alone are not enough, so it is back under APM management.
    # Ops rules and GraphQL fallback live in catalog/skills/linear-task-ops.
    - name: linear
      registry: false
      transport: streamable-http
      url: https://mcp.linear.app/mcp
