# agmsg-delegation review role 用 Codex profile (CONFIG_PROFILE_V2)。
# 正本: ~/.apm/catalog/skills/agmsg-delegation/agmsg-review.config.toml
# 配置先: $CODEX_HOME/agmsg-review.config.toml (spawn は実行ごとの worker home、手起動 pane は ~/.codex 直下)。
# 置き直しと cmp 検証は run-codex-worker.sh が行う。pane 経路は自分で行う (references/resident-pool.md)。
# 意図: 対象 project は read のみ。agmsg の状態書込み (messages.db / teams / run)
#       と一時ファイルだけを許可し、reviewer が READY/REVIEW/ACK を送信できるようにする。
#
# workspace-write は cwd を必ず書込可能にする。run-codex-worker.sh が review role で
# cwd を専用スクラッチへ逃がすことで project の read-only を成立させている。
# writable_roots に対象 project を足してはならない。足すと read-only 契約が黙って壊れる。
#
# Codex は symlink 成分を含む writable_roots を拒否する（"symlinked writable roots are
# not supported" で exec が失敗し、reviewer が READY/REVIEW を送信できなくなる）。
# ~/.agents/skills/agmsg/db・teams は ~/.local/state/agmsg/ への symlink（AGENTS.md
# 「agmsg State」参照）のため、ここには必ず canonical path を列挙する。
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
writable_roots = [
  "/Users/t00114/.local/state/agmsg/db",
  "/Users/t00114/.local/state/agmsg/teams",
  "/Users/t00114/.agents/skills/agmsg/run",
]
