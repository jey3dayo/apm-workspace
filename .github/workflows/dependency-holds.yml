name: Dependency holds

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-holds

jobs:
  probe-holds:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.4
        with:
          cache: true

      - name: Install workspace tools
        run: mise install

      - name: Probe held dependencies
        id: holds
        run: bash scripts/probe-dependency-install.sh holds

      - name: Open an issue for a release candidate
        if: steps.holds.outputs.releasable == '1'
        env:
          TITLE: ${{ steps.holds.outputs.title }}
          BODY: ${{ steps.holds.outputs.body }}
        run: |
          open_titles="$(gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title')"
          if grep -Fxq -- "$TITLE" <<<"$open_titles"; then
            echo "An open issue already has this title."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY"
