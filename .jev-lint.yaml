# jev-lint configuration (https://github.com/mizchi/jev-lint).
#
# Opt-in semantic lint: an ast-grep matcher picks the code, and the Jev
# decision model (TypeSafe AI) answers one plain-language question per rule
# about each match. The judged code is sent to the TypeSafe API, so this is
# NOT part of `mise run check` and never runs in CI. It needs a key in the
# environment (never in this file):
#
#   export TYPESAFE_API_KEY=...
#   mise run jev:dry-run   # plan and price a run, sends nothing
#   mise run jev:check     # judge the files below
#
# A `rules:` map is an allowlist: only the rules listed `on` here run.
# The scope is what this workspace actually holds — Markdown instructions
# and prose (catalog, docs, skills), shell scripts, and the small Python /
# TypeScript helpers. Languages with no files here (Go, Rust, MoonBit,
# Vibe) stay off. Shipped cutoffs were fitted to the upstream corpus, not
# to this repository: read a finding as a candidate for a human to judge.

# Directory traversal does not descend into dot-directories, so the skill
# trees under `.apm/` are listed explicitly — they are the main thing worth
# judging here. manual-skills/ is left out on purpose: it holds upstream
# copies, not prose authored in this workspace.
files:
  [
    catalog/.apm/skills,
    catalog/.apm/instructions,
    catalog/.apm/agents,
    .apm/skills,
    docs,
    scripts,
    optional-skills,
    AGENTS.md,
    README.md,
  ]
exclude: [apm_modules, tmp, "**/fixtures/**"]

rules:
  # Markdown: instructions an agent must be able to follow, and prose
  # worth reading. Applies to SKILL.md, AGENTS.md and docs.
  markdown/agent-instruction-is-unclear: on
  markdown/agent-instructions-conflict: on
  markdown/document-abandons-a-question: on
  markdown/document-is-filler: on
  markdown/document-is-formulaic: on
  markdown/document-is-generic: on
  markdown/document-is-incoherent: on
  markdown/document-is-padded: on
  markdown/document-is-slop: on
  markdown/document-is-vague: on
  markdown/document-lacks-firsthand-evidence: on
  markdown/section-ends-with-a-preview: on
  markdown/section-opens-with-an-agenda: on
  # Shell: what a script does to the machine that a reader cannot see.
  shell/destroys-beyond-its-scope: on
  shell/hides-what-it-runs: on
  shell/installs-persistence: on
  shell/opens-a-backdoor: on
  shell/reads-secrets-it-does-not-own: on
  shell/runs-downloaded-code: on
  shell/takes-remote-commands: on
  shell/weakens-security: on
  # Git: used by `jev-lint commits` / `review`, not by `check`.
  git/campbell: on
  git/commit-message-describes-diff: on
  git/diff-follows-instructions: on
  git/goodhart: on
  # Python helpers under scripts/ and catalog/.
  python/class-shape-shows-its-role: on
  python/comment-describes-block: on
  python/comment-describes-declaration: on
  python/doc-errors-match-body: on
  python/fn-name-promises: on
  python/idempotent-name: on
  python/log-level-matches-event: on
  python/method-name-promises: on
  python/module-name-describes-contents: on
  python/pure-name-is-pure: on
  python/safe-name-is-safe: on
  python/test-name-describes-code: on
  python/tests-cover-failure-paths: on
  # var-name-describes-value is off in both languages: a dry-run measured
  # 2,235 subjects for it (about a quarter of a full run) against a handful
  # of helper scripts — the lowest signal per subject in the catalogue.
  python/var-name-describes-value: off
  # TypeScript helpers (scripts/*.ts and skill assets).
  typescript/catch-hides-failure: on
  typescript/class-shape-shows-its-role: on
  typescript/comment-describes-block: on
  typescript/comment-describes-declaration: on
  typescript/describe-names-subject: on
  typescript/doc-errors-match-body: on
  typescript/error-message-matches-condition: on
  typescript/fn-name-promises: on
  typescript/idempotent-name: on
  typescript/log-level-matches-event: on
  typescript/log-message-matches-event: on
  typescript/method-name-promises: on
  typescript/module-name-describes-contents: on
  typescript/module-naming-consistent: on
  typescript/pure-name-is-pure: on
  typescript/safe-name-is-safe: on
  typescript/snapshot-only-behaviour-claim: on
  typescript/test-mocks-subject: on
  typescript/test-name-describes-code: on
  typescript/test-name-verifies-claim: on
  typescript/tests-cover-failure-paths: on
  typescript/type-name-describes-shape: on
  typescript/var-name-describes-value: off
